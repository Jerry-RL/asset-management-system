spring:
  application:
    name: ams-api
  datasource:
    url: jdbc:postgresql://localhost:5432/ams
    username: ams
    password: ams_dev_password
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8080
  servlet:
    context-path: /

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

org:
  jobrunr:
    background-job-server:
      enabled: true
    dashboard:
      enabled: true
      port: 8000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

ams:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:dev-access-secret-change-me-min-32-chars!!}
    refresh-secret: ${JWT_REFRESH_SECRET:dev-refresh-secret-change-me-min-32-chars!}
    access-expiration-minutes: 120
    refresh-expiration-days: 7
  wechat:
    miniapp:
      app-id: ${WECHAT_APP_ID:}
      app-secret: ${WECHAT_APP_SECRET:}
    pay:
      mch-id: ${WECHAT_MCH_ID:}
      api-v3-key: ${WECHAT_API_V3_KEY:}
      serial-no: ${WECHAT_PAY_SERIAL:}
      private-key-path: ${WECHAT_PAY_KEY_PATH:}
      notify-url: ${WECHAT_PAY_NOTIFY_URL:http://localhost:8080/api/v1/callbacks/wechat-pay}
      app-id: ${WECHAT_PAY_APP_ID:}
  storage:
    type: local
    local-dir: ${AMS_UPLOAD_DIR:./data/uploads}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:ams_minio}
    secret-key: ${MINIO_SECRET_KEY:ams_minio_password}
    bucket: ${MINIO_BUCKET:ams}
  map:
    amap-key: ${AMAP_KEY:dd3e8bb86157af7db922e66c9590c580}
    amap-security-code: ${AMAP_SECURITY_CODE:}
    # 地址解析（Web 服务 API）Key，留空则回退 amap-key
    amap-web-service-key: ${AMAP_WEB_SERVICE_KEY:}
  qr:
    # 手机扫码打开的 H5 根地址（用户端），生产请改为公网域名
    public-base-url: ${AMS_QR_PUBLIC_BASE_URL:http://localhost:5174}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} traceId=%X{traceId} - %msg%n"
