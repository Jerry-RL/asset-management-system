spring:
  autoconfigure:
    exclude:
      - org.jobrunr.spring.autoconfigure.JobRunrAutoConfiguration
      - org.jobrunr.spring.autoconfigure.JobRunrDashboardWebServerAutoConfiguration
      - org.jobrunr.spring.autoconfigure.JobRunrBackgroundJobServerAutoConfiguration
      - org.jobrunr.spring.autoconfigure.storage.JobRunrSqlStorageAutoConfiguration
  datasource:
    url: jdbc:h2:mem:ams_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

org:
  jobrunr:
    background-job-server:
      enabled: false
    dashboard:
      enabled: false

ams:
  scheduling:
    enabled: false
