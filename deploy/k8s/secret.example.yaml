# 复制为 secret.yaml 并填入真实值，勿提交明文 Secret 到 Git
apiVersion: v1
kind: Secret
metadata:
  name: ams-api-secret
  namespace: ams
  labels:
    app.kubernetes.io/name: ams-api
type: Opaque
stringData:
  DATABASE_URL: postgresql://ams:CHANGE_ME@postgres-host:5432/ams
  REDIS_URL: redis://redis-host:6379/0
  JWT_ACCESS_SECRET: CHANGE_ME
  JWT_REFRESH_SECRET: CHANGE_ME
