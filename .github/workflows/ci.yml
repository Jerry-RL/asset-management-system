name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm api:lint
      # 权限与路由一致性守卫（需同时读 backend/src 的 @RequiresPerm，故 cwd 回到仓库根）
      - name: 权限与路由一致性检查
        working-directory: .
        run: node scripts/check-perm-invariants.mjs
      # 源文件编码守卫：BOM 是零宽字符、编辑器里看不见，但会让整个 backend 编译失败
      # （javac：非法字符 '\ufeff'）。本仓已发生过两次，故前移到这一层。
      - name: 源文件编码检查
        working-directory: .
        run: node scripts/check-source-encoding.mjs
      # 后端静态契约守卫（不需要 JDK，把「编译期才会炸」的问题前移到这一层）：
      # 迁移 ↔ 实体列、@TableName、契约测试、RecordSheetService 存取器、
      # 前后端聚合段、AttachmentOwner、V49/V50 结构不变量、pageAssets 实参个数
      - name: 后端契约检查
        working-directory: .
        run: node scripts/check-backend-contracts.mjs
      # 审计覆盖守卫：每个写接口必须显式「记录」(@Audited) 或「豁免」(@AuditedExempt)。
      # 漏加注解的接口照常工作、页面完全看不出来，只是那类操作从此不在审计台账里 ——
      # 而审计的价值恰恰来自「完整」，所以这条必须是硬失败。
      - name: 审计覆盖检查
        working-directory: .
        run: node scripts/check-audit-coverage.mjs

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Maven verify
        working-directory: backend
        run: mvn -B verify
