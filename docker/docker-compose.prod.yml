services:
  api:
    image: ams-api:latest
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../backend/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ams-net

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ams
      POSTGRES_USER: ams
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ams_dev_password}
    volumes:
      - ams-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ams -d ams"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ams-net

  redis:
    image: redis:7-alpine
    volumes:
      - ams-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ams-net

  nginx:
    image: nginx:1.24-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../admin-web/dist:/usr/share/nginx/html/admin:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - ams-net

volumes:
  ams-pg-data:
  ams-redis-data:

networks:
  ams-net:
    name: docker_ams-net
