services:
  postgres:
    image: postgres:15-alpine
    container_name: ams-postgres
    environment:
      POSTGRES_DB: ams
      POSTGRES_USER: ams
      POSTGRES_PASSWORD: ams_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ams-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ams -d ams"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ams-net

  redis:
    image: redis:7-alpine
    container_name: ams-redis
    ports:
      - "6379:6379"
    volumes:
      - ams-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ams-net

  minio:
    image: minio/minio:latest
    container_name: ams-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ams_minio
      MINIO_ROOT_PASSWORD: ams_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ams-minio-data:/data
    networks:
      - ams-net

volumes:
  ams-pg-data:
  ams-redis-data:
  ams-minio-data:

networks:
  ams-net:
    name: docker_ams-net
